name: Bootstrap Import And Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  import-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import local PINECRAFT source archive
        env:
          SOURCE_ARCHIVE_URL: https://c023f8a2424c89.lhr.life/pinecraft-source-clean.tar.gz
        run: |
          set -euxo pipefail
          curl -fL --retry 10 --retry-delay 2 "$SOURCE_ARCHIVE_URL" -o /tmp/pinecraft-source.tar.gz
          rm -rf /tmp/pinecraft-source
          mkdir -p /tmp/pinecraft-source
          tar -xzf /tmp/pinecraft-source.tar.gz -C /tmp/pinecraft-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pinecraft-source/. .
          rm -rf .github/workflows
          git status --short

      - name: Commit imported source
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import PINECRAFT source" || echo "No source changes to commit"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
